  ## Important Constraints
  Four architecture iron laws (highest priority; violating them fails):
  1. Always prefill drafts only — NEVER auto-confirm publish. Prefill stops at the platform-native "save as draft"
     (公众号 title/author/body; B站 title/intro/tags/partition). `ops_publish_now` is removed from tool whitelist,
     RPC endpoints and docs and MUST NOT be reintroduced; no publish-class tool exists.
  2. `published` may only be advanced by backfilling a real URL via `drafts.updatePublishUrl` (`drafts.save`
     rejects `published` with `drafts/published-requires-url`; URL validated by a parser, else
     `drafts/invalid-published-url` — loose regex forbidden). `published` only when ALL channels are backfilled;
     partial stays `prefilled` (never downgraded to `draft`); adding an unbackfilled channel reverts
     `published`→`prefilled`; deleting a channel prunes orphan URLs. `publishedUrls` is server-governed and
     `drafts.save` ignores it; `calendar.updateStatus` cannot write `published`; recompute runs in the same write
     lock as the change.
  3. Never pass off incomplete data as whole-network totals — partial metrics → aggregate `null`; distinguish true
     `0` from missing `null`; fill `measuredPlatforms`/`unmeasuredPlatforms`.
  4. Session data (cookies) is zero-egress — stays local; do not read the daily Chrome cookie store; do not report
     it to any third party (including Injoys).

  Token boundary: `config.get` returns plaintext `token` for backfill/mask-toggle ONLY because the RPC is
  host-internal (in-process / localhost); if it ever becomes reachable off-host it MUST first return only
  `hasToken: boolean`, plaintext on a separate backfill-only channel. No built-in token default (user config or
  `INJOYS_MCP_ENDPOINT`/`INJOYS_MCP_TOKEN`); logs/telemetry MUST redact tokens, cookies and body text (RISK-011).

  Key MUST NOTs: hardcode Injoys tokens / BrowserOS credentials / sensitive config; embed a global Master Key or
  generic credentials; bypass `callOpsRpc` from the client to reach Injoys / BrowserOS / external services; fake
  success (never return success with no client or on failure); fabricate or hardcode metric data; bypass
  `config-store` / `draft-store` for config/draft files; concurrently rewrite the same draft without a lock;
  re-resolve `draftsDir` mid-operation; let `config.save` succeed then `drafts.save` fail with `ENOENT`; let tests
  write the developer's real `$DSH_HOME`; send session cookies to any third party; bypass BrowserOS capability
  switches or the unified exists/enabled/connected check (or the `ops_*` switch) on BrowserOS calls; deliver
  sensitive policy/tokens to the client; introduce an external server or extra listening port;
  introduce WebSocket/SSE/background polling in Phase 0; carry core business rules on the client; hardcode colors;
  implement any auto-publish.

  Key MUSTs (detail above): `config.save` verifies `draftsDir` writability before applying (unique probe
  create+delete; failure → `config/invalid-drafts-dir`, never success-first); storage failures →
  `drafts/storage-unavailable` at all write entries; file permissions limited to the current OS user (TD-013 gap);
  paths via `resolveDshHome` (`profileContext.home` → `DSH_HOME` → `~/.dsh`); publish-URL backfill channel must
  belong to `channelVariants` (`drafts/unknown-channel`, no write/no version bump); `publishedUrls`
  server-governed (`drafts.save` ignores it); capability toggles persist and apply without restart; disabled/absent
  tools report truthfully.

  ## External Dependencies
  - DSH Desktop host: plugin container, slot injection, `POST /api/ops` gateway, automation task center (hard dep).
  - BrowserOS MCP (CDP/Playwright): session probing + draft-box prefill, governed by the capability model above
    (default 8, all exposed tools switchable, one unified check; the old four-action whitelist and shell/cmd ban
    are superseded). Disabled / absent / disconnected tools are reported truthfully (never a false "ready").
    ⚠️ Divergence: `browseros-bridge.ts` hardcodes `EXPECTED_TOOLS` (7, missing `upload`) with no capability
    switches or host-side check yet (TD-012).
  - Injoys MCP (JSON-RPC 2.0 over HTTPS + `Authorization: Bearer {token}`): knowledge base, Spreadsheet
    export/import, Document sink; verify HTTP status and `result.isError`; no built-in token default (user config
    or `INJOYS_MCP_ENDPOINT`/`INJOYS_MCP_TOKEN`); unconfigured ≠ "auth failed".
  - Content platforms (via BrowserOS CDP): prefill target; stop at native save-as-draft.
  - Local filesystem `$DSH_HOME`: config / drafts / calendar / metrics; no DB/queue/cloud (local-first,
    single-user plugin).

rules:
  proposal:
    - State which BR-XXX / criterion constraint / ADR the change derives from, and include asset paths.
    - Keep proposals atomic (one module or functional point); split large features into several atomic proposals.
    - Explicitly mark compliance with the four architecture iron laws; any proposal touching publish, status, metrics aggregation, storage or session must state how it preserves them.
    - Produce acceptance criteria in Given/When/Then (Gherkin) form, traceable to source rules.
    - Do NOT propose reintroducing `ops_publish_now` / auto-publish, DB/ORM, WebSocket/SSE/polling, a standalone server, or multi-product data isolation.
    - Reflect known gaps honestly — mark contract-vs-implementation differences and cite the relevant TD-xx / RISK-xx entries instead of claiming a capability is already implemented.
  specs:
    - Use Given/When/Then (WHEN/THEN) scenario format consistent with `.context/domain/testing_strategy.md`.
    - Cover the edge paths — partial channel backfill, channel add/remove recompute, collection failure vs true zero, insufficient history, unconfigured engine, unwritable dir, concurrency conflict.
  design:
    - Follow the SSoT-first order — `src/types.ts` contract, then `src/ops-rpc.ts` method contract, then Adapter / domain services, then client UI and tests.
    - Reuse existing error codes; keep the RPC envelope backward compatible (or version it explicitly).
    - Do NOT hand-write types/DTOs equivalent to the contract (`src/types.ts`) in business code — keep the SSoT-first contract authoritative (documented "non-contract extension" fields excepted).
    - Enforce all new rules host-side; never rely on client behavior.
  tasks:
    - Break tasks by the SSoT-first layers; include contract update, implementation, and tests per task.
    - Verification gate — `pnpm typecheck` and `pnpm test` pass; test isolation is module-scope; tests never write the real `$DSH_HOME`.
    - Note that OpenSpec validate/archive commands are maintained by the `/context-*` workflows, not redefined here (criterion §6).

    aggregate is `null` with `measuredPlatforms` / `unmeasuredPlatforms`; `totalEngagements` is `null` if
    any of likes/comments/shares/favorites is `null`; insufficient history → delta `null`. Do not consume
    `views` (compat field `impressions ?? plays ?? 0`) as a real missing metric.
  - Product switch: `defaultProduct` only changes knowledge-base retrieval scope and generation
    context — NO data isolation; metrics/schedules/drafts/sessions are global; no `productId` field.
  - Content write boundary: generation saves locally only; writing to Injoys documents requires an
    explicit user action (`workbench.sinkToInjoysDoc`). Knowledge-base reads are unrestricted.
  - `PlatformId` currently lists 9 values; `xiaohongshu` is listed but has no registered adapter
    (8 adapters registered).
  - Implementation status is NOT implied by contracts: `workbench.generateCalendar`, `calendar.*`,
    `workbench.sinkToInjoysDoc` and `tools.*` are not yet implemented (TD-001); `workbench.overview` does
    not yet implement partial-missing aggregation semantics (TD-007); the Phase 2 `browser.login.*`
    endpoints depend on unvalidated BrowserOS CDP capabilities (RISK-012); further gaps are tracked as
    TD-008 / TD-009 / TD-010 / TD-012 / TD-013 / TD-014 in `architecture/risks_and_debt.md`.

  ## Important Constraints
  Four architecture iron laws (highest priority; any proposal violating them fails):
  1. Always prefill drafts only — NEVER auto-confirm publish. Prefill stops at the platform-native
     "save as draft" (微信公众号 fills title/author/body and triggers the native save-draft action;
     B站 fills title/intro/tags/partition and saves as draft). `ops_publish_now` was fully removed from
     the tool whitelist, RPC endpoints and docs; it MUST NOT be reintroduced in any form. There are no
     publish-class tools, so such a call cannot be constructed.
  2. `published` may only be advanced by backfilling a real URL via `drafts.updatePublishUrl`
     (`drafts.save` must reject `published` with `drafts/published-requires-url`; the URL is validated by
     a URL parser, else `drafts/invalid-published-url` — a loose regex is forbidden). Multi-channel
     drafts are `published` only when ALL channels are backfilled; partial backfill stays `prefilled`
     (never downgraded to `draft`); adding an unbackfilled channel reverts `published`→`prefilled`;
     deleting a channel prunes orphan URLs. `publishedUrls` is a server-governed field that `drafts.save`
     must ignore; `calendar.updateStatus` cannot write `published`. Enforcement is host-side, not
     client-side.
  3. Never pass off incomplete data as whole-network totals — partial metrics → aggregate `null`;
     distinguish true `0` from missing `null`; fill `measuredPlatforms` / `unmeasuredPlatforms`.
  4. Session data (cookies) is zero-egress — it stays in the local sandbox; do not read the daily Chrome
     cookie store; do not report it to any third party (including Injoys).

  Token boundary: `config.get` returns the plaintext `token` for form backfill and mask-toggle ONLY
  because the RPC is host-internal (in-process / localhost) and is not an external network endpoint.
  Its precondition is that if the RPC ever becomes reachable off-host it MUST first return only
  `hasToken: boolean` with the plaintext on a separate backfill-only channel. Tokens have no built-in
  default (user config, or `INJOYS_MCP_ENDPOINT` / `INJOYS_MCP_TOKEN` fallback); logs and telemetry MUST
  redact tokens, cookies and full body text (see RISK-011).

  Key MUST NOTs: hardcode Injoys tokens / BrowserOS credentials / any sensitive config; embed a global
  universal Master Key or generic credentials; bypass `callOpsRpc` from the client to reach Injoys /
  BrowserOS / external services; fake success (never return success when there is no client or the
  action failed); fabricate or hardcode metric data; bypass `config-store` / `draft-store` to touch
  config/draft files directly; concurrently rewrite the same draft without a lock; re-resolve `draftsDir`
  mid-operation; let `config.save` report success and then have `drafts.save` fail with `ENOENT`; let
  tests write the developer's real `$DSH_HOME`; send session cookies to any third party; disable the
  BrowserOS shell/cmd ban; deliver sensitive policy/tokens to the client; introduce an external
  long-running server or extra listening port; introduce WebSocket/SSE/background polling in Phase 0;
  carry core business rules (state machine, permission logic) on the client; hardcode colors;
  implement any auto-publish capability.

  Key MUSTs: all RPC methods return the unified envelope and throw truthful error codes; platform
  differences stay in the Adapter layer; Injoys and BrowserOS calls remain centralized in their client
  wrapper entry points; errors are never swallowed; config changes hot-propagate to the running
  `InjoysClient` (`updateConfig`) with no restart; session probing / prefill / metrics collection share
  ONE BrowserOS MCP instance; `config.save` must prepare and verify writability of `draftsDir` before
  applying (create AND delete a unique probe file; failure → `config/invalid-drafts-dir`, never report
  success first); storage write failures map to `drafts/storage-unavailable` at the unified RPC error
  boundary across all write entry points; system file permissions limited to the current OS user
  (implementation gap tracked as TD-013); paths resolved via `resolveDshHome` (`profileContext.home` →
  `DSH_HOME` → `~/.dsh`); publish-URL backfill channel must belong to the draft's `channelVariants`
  (`drafts/unknown-channel`, no write/no version bump); `publishedUrls` is a server-governed field that
  `drafts.save` must ignore; error handling must not swallow errors.

  ## External Dependencies
  - DSH Desktop host: plugin container, slot injection, `POST /api/ops` RPC gateway, automation task
    center (hard dependency; plugin cannot load without it). Failure → plugin cannot load.
  - BrowserOS MCP (CDP/Playwright): session probing and draft-box prefill; action whitelist
    `tabs` / `navigate` / `snapshot` / `act`, shell/cmd disabled. Failure → cannot prefill; session state
    returns `unknown` (never a false positive). ⚠️ Implementation divergence: the bridge's actual
    `EXPECTED_TOOLS` set is wider (adds `read` / `grep` / `wait`, plus an `upload` call) and no host-side
    whitelist enforcement exists yet — see TD-012; treat the whitelist as the contract, not as an
    implemented guarantee.
  - Injoys MCP (JSON-RPC 2.0 over HTTPS + `Authorization: Bearer {token}`): knowledge base, Spreadsheet
    export/import, Document sink. Verify HTTP status and `result.isError`. No built-in token default
    (user config or `INJOYS_MCP_ENDPOINT` / `INJOYS_MCP_TOKEN` fallback); when unconfigured, do not
    falsely report "auth failed".
  - Content platform backends (via BrowserOS CDP): prefill target; stop at native “save as draft”.
  - Local filesystem `$DSH_HOME`: config / drafts / calendar / metrics; prepare and verify writability
    before writing.
  - No database, message queue, or cloud service: this is a local-first, single-user desktop plugin.

rules:
  proposal:
    - State which BR-XXX / criterion constraint / ADR the change derives from, and include asset paths.
    - Keep proposals atomic (one module or functional point); split large features into several atomic proposals.
    - Explicitly mark compliance with the four architecture iron laws; any proposal touching publish, status, metrics aggregation, storage or session must state how it preserves them.
    - Produce acceptance criteria in Given/When/Then (Gherkin) form, traceable to source rules.
    - Do NOT propose reintroducing `ops_publish_now` / auto-publish, DB/ORM, WebSocket/SSE/polling, a standalone server, or multi-product data isolation.
    - Reflect known gaps honestly — mark contract-vs-implementation differences and cite the relevant TD-xx / RISK-xx entries instead of claiming a capability is already implemented.
  specs:
    - Use Given/When/Then (WHEN/THEN) scenario format consistent with `.context/domain/testing_strategy.md`.
    - Cover the edge paths — partial channel backfill, channel add/remove recompute, collection failure vs true zero, insufficient history, unconfigured engine, unwritable dir, concurrency conflict.
  design:
    - Follow the SSoT-first order — `src/types.ts` contract, then `src/ops-rpc.ts` method contract, then Adapter / domain services, then client UI and tests.
    - Reuse existing error codes; keep the RPC envelope backward compatible (or version it explicitly).
    - Do NOT hand-write types/DTOs equivalent to the contract (`src/types.ts`) in business code — keep the SSoT-first contract authoritative (documented "non-contract extension" fields excepted).
    - Enforce all new rules host-side; never rely on client behavior.
  tasks:
    - Break tasks by the SSoT-first layers; include contract update, implementation, and tests per task.
    - Verification gate — `pnpm typecheck` and `pnpm test` pass; test isolation is module-scope; tests never write the real `$DSH_HOME`.
    - Note that OpenSpec validate/archive commands are maintained by the `/context-*` workflows, not redefined here (criterion §6).

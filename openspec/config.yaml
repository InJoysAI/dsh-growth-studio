    `authenticated` channels.
  - Pipeline: BR-020 (MUST) `ItemStatus` five states forward-only (sole explicit exception: a published draft
    that gains an unbackfilled channel reverts to `prefilled`, per BR-021); BR-021 (MUST) publish
    closure + all-channel invariant (iron law 2); BR-022 (MUST, iron law) prefill-only; BR-023 (SHOULD) one-click

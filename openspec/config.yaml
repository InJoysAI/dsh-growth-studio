  # dsh-growth-studio — Project Context (derived snapshot)

  Read-only refined snapshot of the authoritative `.context/` assets (authority: `.context/criterion.md`;
  architecture/domain facts: their own assets). Adds no constraint absent from those sources. Do not hand-edit.

  ## Purpose
  DSH Desktop plugin ("Growth Studio / 个人产品增长推广工坊") for individual multi-platform promotion; closes
  排期 → 创作 → 预填 → 人工发布 → 指标复盘 in the DSH settings page (BR-001). One channel matrix over 8 platforms
  (国内 公众号/哔哩哔哩/视频号/抖音; 海外 YouTube/X/Product Hunt/TikTok), staged: Phase 0 = 公众号 + B站; Phase 1
  adds 视频号 + 抖音; Phase 2 the rest (BR-002); undelivered channels never count as "ready". AI only
  generates/prefills; publishing is always manual. Product switching changes only generation scope, not data
  isolation (BR-003).

  ## Tech Stack
  In-process Cordis plugin inside DSH Desktop — NO standalone server, NO listening port, NO container, NO cloud.
  - Host: TypeScript `^5.6.0`, Node.js `^22.19.0 || >=24.0.0`, ESM, microkernel `@deepseek-ai/cordis` `^4.0.2`,
    `@deepseek-ai/dsh-tools`/`@deepseek-ai/dsh-system-prompt` `0.2.1-alpha.2`; only runtime dep
    `@deepseek-ai/schemastery` `^3.18.4`.
  - Client: JavaScript + React 18 via esbuild `^0.28.2`; injected into `settings.section` (`id: 'ops'`,
    `order: 60`) via `window.__ModuleLoader__.load(...)` (loaderId `dsh-growth-studio`; injects
    `@deepseek-ai/dsh-client-connection`/`-ui-settings`).
  - Tooling: pnpm; `build` (tsc `^5.6.0`), `build:client` (esbuild), `typecheck`, `test` (vitest `^3.0.0`).
  - Persistence: local JSON only (no DB/ORM/migrations): `$DSH_HOME/ops-manager/config.json`,
    `.../growth-studio/drafts/{id}.json`, `.../calendar/{id}.json`, `.../metrics/{YYYY-MM-DD}.json`.

  ## Code Style
  - Host TS, client JS (ESM); types are NOT shared across that boundary.
  - RPC methods return `{ ok, result?, error? }` and throw truthful `{domain}/{kebab-case-reason}` codes
    (e.g. `drafts/published-requires-url`); no near-duplicate codes.
  - Platform differences stay in `src/adapters/` (Adapter Pattern); no branching elsewhere.
  - Client data access only via `callOpsRpc` (`POST /api/ops`).
  - Client styling uses DSH tokens (`var(--dsw-alias-*)`); only interaction accent colors are fixed (主操作蓝
    `#1677ff`, 安全绿 `#15803d`, 告警橙 `#b45309`, 活力紫 `#7c3aed`); no other hardcoded colors.
  - UI state domains `loading`/`error`/`data`; a `null` metric renders “暂无数据”, never `0`.

  ## Architecture Patterns
  Layered: client view → host RPC gateway → domain services → external MCP → local persistence.
  - RPC gateway `POST /api/ops` (custom envelope, NOT REST/OpenAPI/gRPC): client sends
    `{ type:'client-request', rpcId, method:'ops', payload:{ method, payload } }`, host replies
    `{ type:'server-response', rpcId, result }`; validates Content-Type/`client-request`/`ops`, requires `payload`
    (not `params`), rejects unknown methods.
  - Host MUSTs: Injoys/BrowserOS calls centralized in client wrappers; errors never swallowed; config changes
    hot-propagate to `InjoysClient` (`updateConfig`, no restart; saving `injoys` clears target-isolated caches);
    session probing / prefill / metrics share ONE BrowserOS MCP instance.
  - Unified RPC error boundary: recoverable storage failures map to `drafts/storage-unavailable` at all write
    entries (never `ops/internal-error`); `draftSaved:false` = generated-but-NOT-persisted (retry signal), never
    wraps a storage error.
  - Persistence: atomic write (temp + `rename`) + serial write lock keyed by absolute file path; draft saves use
    `version`/`expectedVersion` optimistic locking, the calendar store has NO such lock (A1); the target directory
    is captured at request start and fixed for the whole operation, including writes inside a cross-`await` RPC.
    Clients MUST NOT specify arbitrary paths (the directory is host-resolved, never caller-chosen).
  - Directory hot-switch: DETERMINISTIC fixed-directory behavior — never add a `dirChangedDuringSave` flag. The
    config page must state: the new directory applies to later operations; an in-progress save still writes to
    the original directory; old drafts are NOT auto-migrated.
  - BrowserOS capability management (ADR-009, TAD §3.12): one entry checks exists/enabled/connected per call;
    default 8 on (`tabs` `navigate` `snapshot` `act` `read` `grep` `wait` `upload`), every exposed tool switchable,
    nothing permanently banned (`shell`/`cmd` user-managed if exposed); `browseros.capabilities` lists live tools
    only; codes `browser/capability-disabled` / `tool-unavailable` / `not-connected`; `ops_*` paths need BOTH.
    Contract only (TD-012).
  - Invariants run under lock: a channel-set change recomputes publish state in the SAME write lock (iron law 2).
    MVP draft storage keeps only the current `{id}.json`; `version` is concurrency-only — no snapshots/history.
  - Local `$DSH_HOME/growth-studio/` is the golden master; Injoys Spreadsheet/Document are one-way export/sink
    targets (idempotent by `externalRowId` / `injoysDocId`).
  - Scheduling: `ops_setup_schedule` registers periodic inspection via the DSH automation center (host tool call;
    default cron `0 9 * * 1`, `Asia/Shanghai`), distinct from forbidden polling.
  - Refresh (Phase 0, criterion §3.4 / ADR-007): user-manually-triggered RPC + local partial state replacement
    (no full reload); same-card concurrent refresh MUST in-flight dedup; NO WebSocket/SSE/background polling.

  ## Testing Strategy
  - BDD Gherkin acceptance criteria by module (驾驶舱/渠道矩阵, 日历与发布流水线, 创作室, 草稿箱预填安全边界,
    舆情提炼, 引擎配置, 工具中枢, 热点与沉淀) + capability cases (default-8, restart persistence, unexposed
    hidden, two-layer rejection).
  - Commands: `pnpm typecheck`, `pnpm test` (vitest).
  - Test isolation is module-scope BEFORE test imports (`tests/setup-isolation.ts`, NOT `beforeAll`); each
    config-writing case uses its own `DSH_HOME`/`profileContext.home`; never the real `$DSH_HOME`.
  - DoD: iron-law checks, full-channel invariants, metric truthfulness, Phase 0 Live checklist, UAT.
  - Client RPC consumption (`callOpsRpc`/`unwrapRpcResult`) has no test coverage yet (TD-014).

